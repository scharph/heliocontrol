services:
  heliocontrol:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # the controller clock and trend timestamps are local time
      TZ: Europe/Vienna
      # Loxone-compatible HtREST API under /api/v1 (README → Loxone)
      # HELIOCONTROL_HTREST: "true"
